name: Analizar Perfu Luxe
on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 9:00 hora Argentina
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scraper/scrape.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: debug, path: debug/, if-no-files-found: ignore }
      - name: Guardar datos
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Datos $(date -u +%F)" && git push)
